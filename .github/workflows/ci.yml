name: CI & Deployment Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-verification:
    name: Backend Lint & Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: logic-crafts-connect/backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: logic-crafts-connect/backend
        run: npm ci

      - name: Verify Backend Server Code Syntax
        working-directory: logic-crafts-connect/backend
        run: |
          node --check server.js
          node --check config/db.js
          node --check config/setupDatabase.js

  frontend-build:
    name: Frontend Build & Asset Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: logic-crafts-connect/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: logic-crafts-connect/frontend
        run: npm ci

      - name: Build Frontend for Production
        working-directory: logic-crafts-connect/frontend
        run: npm run build
        env:
          VITE_API_URL: https://logic-crafts-backend.onrender.com/api
